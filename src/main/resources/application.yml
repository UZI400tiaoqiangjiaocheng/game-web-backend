server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: ${sky.datasource.driver-class-name}
    url: jdbc:mysql://localhost:3306/game_web
    username: ${sky.datasource.username}
    password: ${sky.datasource.password}
  servlet:
    multipart:
      #配置文件上传的最大大小
      max-file-size: 10MB
      max-request-size: 10MB
  redis:
    host: ${sky.redis.host}
    port: ${sky.redis.port}
    password: ${sky.redis.password}
    database: ${sky.redis.database}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.itmy.pojo.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

aliyun:
  oss:
    endpoint: ${sky.aliyun.oss.endpoint}
    bucketName: ${sky.aliyun.oss.bucketName}
    region: ${sky.aliyun.oss.region}

alipay:
  easy:
    protocol: https
    gatewayHost: openapi-sandbox.dl.alipaydev.com
    signType: RSA2
    appId: 9021000164663471
    merchantPrivateKey: 
    alipayPublicKey: 
    notifyUrl: https://1922b808.r10.vip.cpolar.cn/notify